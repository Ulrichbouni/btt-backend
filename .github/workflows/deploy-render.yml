name: Deploy Backend to Render

on:
  push:
    branches: [main]
    paths:
      - 'server.js'
      - 'routes/**'
      - 'middleware/**'
      - 'services/**'
      - 'db.js'
      - 'package.json'
      - 'render.yaml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Trigger Render deploy hook
        run: |
          curl -f -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" || echo "::warning title=Deploy hook::Le secret RENDER_DEPLOY_HOOK_URL n'est pas configuré ou le hook a échoué (vérifier Render)"